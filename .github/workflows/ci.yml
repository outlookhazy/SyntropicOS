name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Run Containerized Suite
    runs-on: ubuntu-latest

    env:
      CONTAINER_ENGINE: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pre-build Testing Container Image
        run: |
          make -C tools/containers container-build

      - name: Run Containerized Code Formatting Check
        run: |
          make container-format

      - name: Run Containerized Unit Tests & Coverage
        run: |
          make container-test

      - name: Run Containerized Cortex-M4 QEMU & Cooperative Chunk-Budget Gate
        run: |
          make container-qemu

