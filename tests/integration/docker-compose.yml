version: '3.8'

services:
  # 1. Official Eclipse Mosquitto MQTT Broker Daemon
  mosquitto:
    image: docker.io/library/eclipse-mosquitto:latest
    container_name: syntropicos-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./services/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:z
    networks:
      syn_net:
        ipv4_address: 172.28.0.10

  # 2. Official Chrony SNTP Daemon
  sntp:
    build:
      context: ./services/sntp
      dockerfile: Containerfile
    container_name: syntropicos-sntp
    ports:
      - "10123:123/udp"
    networks:
      syn_net:
        ipv4_address: 172.28.0.20

  # 3. Official Nginx HTTP Web Server Daemon
  http:
    image: docker.io/library/nginx:alpine
    container_name: syntropicos-nginx
    ports:
      - "10080:80"
    volumes:
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      syn_net:
        ipv4_address: 172.28.0.40

  # 4. Standard Node.js ws WebSocket Daemon
  ws:
    build:
      context: ./services/ws
      dockerfile: Containerfile
    container_name: syntropicos-ws
    ports:
      - "10081:8080"
    networks:
      syn_net:
        ipv4_address: 172.28.0.50

  # 5. Official CoreDNS UDP Name Server Daemon
  dns:
    image: docker.io/coredns/coredns:latest
    container_name: syntropicos-dns
    ports:
      - "10053:53/udp"
    volumes:
      - ./services/coredns/Corefile:/etc/coredns/Corefile:ro
      - ./services/coredns/db.syntropic.local:/etc/coredns/db.syntropic.local:ro
    command: -conf /etc/coredns/Corefile
    networks:
      syn_net:
        ipv4_address: 172.28.0.60

  # 6. Virtual CAN & CANopen Node Daemon (SocketCAN vcan0)
  can:
    build:
      context: ./services/can
      dockerfile: Containerfile
    container_name: syntropicos-can
    cap_add:
      - NET_ADMIN
    networks:
      syn_net:
        ipv4_address: 172.28.0.70

  # 7. WireGuard VPN Tunnel Server Daemon
  wireguard:
    build:
      context: ./services/wireguard
      dockerfile: Containerfile
    container_name: syntropicos-wireguard
    cap_add:
      - NET_ADMIN
    ports:
      - "51820:51820/udp"
    volumes:
      - ../..:/workspace:z
    command:
      - /bin/bash
      - -c
      - |
        printf '\x02%.0s' {1..32} | base64 -w0 > /tmp/srv.key
        printf '\x01%.0s' {1..32} | base64 -w0 | wg pubkey > /tmp/cli.pub
        if ip link add dev wg0 type wireguard 2>/dev/null; then
          ip address add 10.0.0.1/24 dev wg0
          wg set wg0 listen-port 51820 private-key /tmp/srv.key peer "`cat /tmp/cli.pub`" allowed-ips 10.0.0.2/32
          ip link set mtu 1420 up dev wg0
          echo "[WireGuard Server] Kernel wg0 online on 51820/udp."
          exec tail -f /dev/null
        fi
        echo "[WireGuard Server] Kernel wg0 unavailable in userns; awaiting container wg_daemon..."
        while [ ! -x /workspace/build/tests/wg_daemon ]; do sleep 0.1; done
        exec /workspace/build/tests/wg_daemon
    networks:
      syn_net:
        ipv4_address: 172.28.0.80

  # 8. Modbus TCP Industrial Server Daemon
  modbus:
    build:
      context: ./services/modbus
      dockerfile: Containerfile
    container_name: syntropicos-modbus
    ports:
      - "5020:5020"
    networks:
      syn_net:
        ipv4_address: 172.28.0.90

  # 9. EtherCAT SOEM Master Daemon
  ethercat-soem:
    build:
      context: ./services/ethercat
      dockerfile: Containerfile
    container_name: syntropicos-ethercat-soem
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "10884:10884"
    command:
      - python3
      - -u
      - -c
      - "exec(open('/app/pysoem_daemon.py').read().replace('127.0.0.1', '0.0.0.0'))"
    networks:
      syn_net:
        ipv4_address: 172.28.0.100

  # 10. EtherCAT SOES Slave Daemon (OpenEtherCATSociety SOES C Slave)
  ethercat-soes:
    build:
      context: ./services/ethercat
      dockerfile: soes_Containerfile
    container_name: syntropicos-ethercat-soes
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "10885:10885"
    networks:
      syn_net:
        ipv4_address: 172.28.0.101

  # 11. SyntropicOS UDS C Server Daemon
  uds:
    build:
      context: ../..
      dockerfile: tests/integration/services/uds/Containerfile
    container_name: syntropicos-uds
    ports:
      - "10886:10886"
    networks:
      syn_net:
        ipv4_address: 172.28.0.102

  # 12. SyntropicOS ISO-TP C Server Daemon
  isotp:
    build:
      context: ../..
      dockerfile: tests/integration/services/isotp/Containerfile
    container_name: syntropicos-isotp
    ports:
      - "10887:10887"
    cap_add:
      - NET_ADMIN
    networks:
      syn_net:
        ipv4_address: 172.28.0.103

  # 13. SyntropicOS DoIP C Server Daemon
  doip:
    build:
      context: ../..
      dockerfile: tests/integration/services/doip/Containerfile
    container_name: syntropicos-doip
    ports:
      - "13400:13400"
      - "13400:13400/udp"
    networks:
      syn_net:
        ipv4_address: 172.28.0.104

  # 14. SyntropicOS Integration Test Runner Container
  test-runner:
    profiles:
      - compose-only
    build:
      context: ../..
      dockerfile: tools/containers/Containerfile
    container_name: syntropicos-integration-runner
    cap_add:
      - NET_ADMIN
    depends_on:
      - mosquitto
      - sntp
      - http
      - ws
      - dns
      - wireguard
      - modbus
      - ethercat-soem
      - ethercat-soes
      - uds
      - isotp
      - doip
    environment:
      - MQTT_HOST=mosquitto
      - SNTP_HOST=sntp
      - HTTP_HOST=http
      - WS_HOST=ws
      - DNS_HOST=dns
      - WG_HOST=wireguard
      - MODBUS_HOST=modbus
      - ETHERCAT_HOST=ethercat-soem
      - ETHERCAT_SOES_HOST=ethercat-soes
      - UDS_HOST=uds
      - ISOTP_HOST=isotp
      - DOIP_HOST=doip
    volumes:
      - ../..:/workspace:z
    command: ["/bin/bash", "-c", "tr -d '\\r' < /workspace/tests/integration/run_integration.sh > /tmp/run.sh && bash /tmp/run.sh"]
    networks:
      syn_net:
        ipv4_address: 172.28.0.200

networks:
  syn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
